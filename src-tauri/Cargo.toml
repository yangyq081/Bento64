[package]
name = "base64-local"
version = "0.2.1"
description = "Offline Base64 text and file converter"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "base64_local_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
